name: pura
on:
  push:
    branches: [main]
    paths: ['paket.zip']
permissions:
  contents: write
jobs:
  pura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o paket.zip
          rm paket.zip
          git config user.name "jarvis-bot"
          git config user.email "jarvis-bot@users.noreply.github.com"
          git add -A
          git commit -m "Lisaa JARVIS-perusversio"
          git push
